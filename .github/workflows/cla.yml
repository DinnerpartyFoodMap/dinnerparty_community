name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: 检查 CLA 签署
        # pull_request_target 带写权限运行，因此按提交哈希固定版本（v2.6.1）；本任务不检出 PR 代码
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/bl3x3/dinnerparty_community/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: bl3x3,Chenan-LightFox,lofur,bot*
          custom-notsigned-prcomment: '感谢你的贡献！本项目要求外部贡献者先签署[贡献者许可协议（CLA）]($pathToCLADocument)。阅读后请在本 PR 中原样回复下面这句话完成签署（Please read the CLA and sign it by posting the sentence below as a comment）：'
          custom-allsigned-prcomment: '所有贡献者都已签署 CLA。'
          create-file-commit-message: '创建 CLA 签名记录文件'
          signed-commit-message: '$contributorName 在 PR #$pullRequestNo 中签署了 CLA'
