<!doctype html>
<html lang="zh-cn">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>东方饭联地图</title>
    <!-- 高德 JS API 由 src/platform/amapLoader.js 按运行配置动态加载：
         先写入 window._AMapSecurityConfig，再插入 SDK 脚本，并支持失败重试。 -->
    <style>
        @keyframes yuyuko-card-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes yuyuko-thinking-spin {
            to { transform: rotate(360deg); }
        }

        :root {
            --app-height: 100vh;
            color-scheme: light;

            /* 安全区与键盘避让：Android 原生壳可能通过 --safe-area-inset-* 注入，其余环境使用 env() */
            --safe-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px));
            --safe-right: var(--safe-area-inset-right, env(safe-area-inset-right, 0px));
            --safe-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
            --safe-left: var(--safe-area-inset-left, env(safe-area-inset-left, 0px));
            --keyboard-inset: 0px;

            /* 颜色、字体、圆角等设计令牌在 src/styles/tokens.json（生成 tokens.generated.css，由 main.jsx 引入） */
        }

        :root[data-theme='dark'] {
            color-scheme: dark;
        }

        @supports (height: 100dvh) {
            :root {
                --app-height: 100dvh;
            }
        }

        html,
        body,
        #root {
            height: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background: var(--color-bg-base);
            color: var(--color-text-primary);
            font-family: var(--font-sans);
            overscroll-behavior: none;
        }

        /* 表单控件默认不继承字体族（浏览器用自己的系统字体），统一跟随正文；字号仍由各组件决定 */
        button,
        input,
        textarea,
        select {
            font-family: inherit;
        }

        ::selection {
            background: var(--color-glow);
            color: var(--color-text-primary);
        }

        #map {
            width: 100%;
            height: 100%;
        }

        input,
        textarea,
        select {
            font-size: 16px;
        }

        /* App 内：去掉点击高亮与图片/链接长按的系统菜单（文本仍可选中复制） */
        :root[data-platform='ios'] img,
        :root[data-platform='ios'] a,
        :root[data-platform='android'] img,
        :root[data-platform='android'] a {
            -webkit-touch-callout: none;
        }

        :root[data-platform='ios'] body,
        :root[data-platform='android'] body {
            -webkit-tap-highlight-color: transparent;
        }

        /* 键盘弹出时（App 内由原生键盘事件设置 .keyboard-open 与 --keyboard-inset）：
           WebView 已按键盘缩小（Keyboard.resize = native），这里只收起底部常驻工具条，避免挤占输入区 */
        .keyboard-open [data-hide-when-keyboard] {
            display: none !important;
        }

    </style>
    <link rel="stylesheet" data-consent-href="https://cdn.mccolor.cc/fonts/material-symbols.css" />
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
